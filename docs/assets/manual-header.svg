<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="EDL Commander user manual">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff00d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="240" fill="#0b0b16"/>
  <circle cx="130" cy="120" r="72" fill="none" stroke="url(#ring)" stroke-width="12" filter="url(#glow)"/>
  <text x="250" y="118" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="url(#ring)">EDL Commander</text>
  <text x="252" y="164" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#c9d1ff">User Manual</text>
</svg>
