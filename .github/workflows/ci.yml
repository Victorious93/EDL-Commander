name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p edl-cli -- validate-db database
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # `packages: ""` skips the action's default `tools` package, which the current sdkmanager no longer offers.
      - uses: android-actions/setup-android@v3
        with: { packages: "" }
      - name: Install Android platform, build-tools and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      # Builds libedl_jni (cargo-ndk, arm64-v8a/armeabi-v7a/x86_64) into the APK; the JVM tests also load
      # a host build of the same library to exercise the real JNI glue against a Kotlin Sahara test double.
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Check the native library is packaged
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/$abi/libedl_jni.so"
          done
      # Signed with the ephemeral debug key, so it is not bind-compatible with a fleet-signed Droidcommand.
      # A full account artifact storage quota shouldn't fail an otherwise good build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: edl-commander-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
