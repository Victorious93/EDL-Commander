[workspace]
resolver = "2"
members = ["core", "simulator", "tools/edl-cli", "android/native/edl-jni"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
